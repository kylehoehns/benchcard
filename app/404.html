<script>
/* The same pre-paint theme resolution as the app and as about.html, and
   deliberately a copy rather than a shared file: it has to run before
   first paint, so a shared file would be an extra blocking request on a page
   whose whole point is that it loads fast from anywhere. Reads the app's own
   stored preference so arriving here from a dark-mode app does not flash
   white. Every key we have written, newest first. */
(function () {
  try {
    var get = function (k) {
      // per key, so a corrupt v7 blob still lets v6, v5, v4 or v3 answer
      try { return (JSON.parse(localStorage.getItem(k)) || {}).ui; } catch (e) { return null; }
    };
    var ui = get('benchcard.v7') || get('benchcard.v6') || get('benchcard.v5') || get('benchcard.v4') || get('benchcard.v3');
    var t = ui && ui.theme;
    if (t !== 'light' && t !== 'dark') {
      t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    }
    document.documentElement.setAttribute('data-theme', t);
    document.querySelector('meta[name="theme-color"]')
      .setAttribute('content', t === 'dark' ? '#0B0B0C' : '#F4F4F6');
  } catch (e) {}
})();
</script>
