name: Claude Code Review

# Stage 5 of the AI-native SDLC: every pull request gets the same review passes,
# against a policy that lives in the repo rather than in whoever is reviewing.
#
# THIS IS NOT A REQUIRED CHECK AND MUST NOT BECOME ONE. Findings inform; they do
# not approve or block. Branch protection already requires the five deterministic
# checks in test.yml, and those are the ones that can be wrong in only one
# direction. A review that can block turns every false positive into a merge
# outage, and the fix people reach for is muting the reviewer.

#
# A GREEN CHECK HERE CAN MEAN "DID NOT RUN". The action refuses to execute a
# workflow file whose content differs from the copy on the default branch --
# a PR cannot rewrite the reviewer and then have the rewritten reviewer run
# with the repository's token. When that happens the step logs "Skipping
# action due to workflow validation" and the job still finishes SUCCESS.
#
# Two consequences, both observed on the pull request that added this file:
#   * the first PR carrying this workflow is never reviewed by it. Expected.
#   * any later PR that edits these workflows is not reviewed either, so a
#     change to the reviewer has to be judged by a person.
# If a review is silently missing, read the run log before assuming the
# reviewer had nothing to say. Twelve seconds is not a review.

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
    # A FILTER IS CORRECT HERE AND FORBIDDEN ON test.yml, and the difference is
    # the whole reason to state it: this is NOT a required check. A required
    # check that does not run leaves a PR pending forever; an advisory one that
    # does not run simply has no opinion. `test/ci-config.test.js` enforces the
    # other half.
    #
    # Only two paths, deliberately narrow. `notes/` is the queue, the research
    # and the closed-work log; `docs/` is reference prose. Neither is shipped --
    # `app/` is the only deployed directory -- and neither carries a rule that
    # binds a session.
    #
    # ROOT *.md IS NOT EXCLUDED, and the evidence is PR #4: the review's second
    # finding was a real contradiction introduced into AGENTS.md, in a change
    # that looked like documentation. AGENTS.md, REVIEW.md, CLAUDE.md and
    # README.md are rules and front door, and a mistake in them costs more than
    # a mistake in code because everything downstream inherits it.
    paths-ignore:
      - 'notes/**'
      - 'docs/**'

# A review of a commit nobody is looking at any more is spend with no reader.
# Rapid pushes collapse into one review of the latest state.
concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  claude-review:
    # SKIP PULL REQUESTS FROM FORKS. This repository is public, and GitHub
    # withholds secrets from fork-triggered runs -- so the job cannot
    # authenticate and would fail on every outside contribution. A red check
    # that means "we did not run this" is worse than no check: it reads as
    # "your change is broken" to someone who has done nothing wrong.
    # To review a fork PR, comment `@claude review this` and claude.yml handles
    # it, which runs with the base repository's trust rather than the fork's.
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: 'https://github.com/anthropics/claude-code.git'
          plugins: 'code-review@claude-code-plugins'
          prompt: '/code-review:code-review --comment ${{ github.repository }}/pull/${{ github.event.pull_request.number }}'
          # `--append-system-prompt` IS HOW REVIEW.md GETS READ AT ALL. The
          # `/code-review` skill follows CLAUDE.md like any session but does NOT
          # read REVIEW.md -- only Anthropic's managed Code Review service does
          # that, and this repository is not on it. Appending the instruction is
          # what makes the policy file more than a document nobody opens.
          #
          # It cannot go in `prompt`: without `ultra`, everything after the
          # flags is read as the review TARGET, so prose there would be taken as
          # a path to review rather than an instruction.
          claude_args: >-
            --allowedTools "mcp__github_inline_comment__create_inline_comment"
            --max-turns 40
            --append-system-prompt "Review against REVIEW.md at the repository root: it defines the passes, what Important and Nit mean here, and which paths are excluded. AGENTS.md is the harness and says why each rule exists. Severity is not a matter of taste in this repo -- REVIEW.md lists blockers that are never traded for a follow-up ticket, and a Nit cap. Respect both."
