name: Claude Code

# The other half of Stage 5, and the half worth more on a repository with one
# contributor: Claude RECEIVES review. Tag `@claude` on a review comment and it
# addresses the point and pushes the fix to the branch, rather than handing back
# a suggestion for someone to retype.
#
# WRITE PERMISSIONS ARE THE POINT HERE, and are a real grant. The generated
# template shipped read-only, which lets Claude answer a comment but not act on
# it -- the interesting half of the loop, missing. The blast radius stays small
# for reasons that are not this file's doing: branch protection means a push
# still cannot reach main except through a pull request and five green checks,
# and the action refuses to run for anyone without write access to the repo.

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

concurrency:
  group: claude-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write        # so a fix is a commit, not a suggestion
      pull-requests: write
      issues: write
      id-token: write
      actions: read          # lets Claude read why a check went red
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          additional_permissions: |
            actions: read
          # AGENTS.md is the harness and CLAUDE.md points at it, so a session
          # here already loads the traps and the rules. What it does not load on
          # its own is the fact that this repository now refuses direct pushes:
          # a fix has to land on the PR branch, and the five checks decide.
          claude_args: >-
            --max-turns 60
            --append-system-prompt "Read AGENTS.md before changing anything; it is the harness. Nothing reaches main except through a pull request, so push fixes to the PR branch and let the checks report -- never try to push to main. Do not approve a pull request: REVIEW.md says the approval is a human's. Run npm test and npm run smoke before claiming a change works, and say what you actually ran."
